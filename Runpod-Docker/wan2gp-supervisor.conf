[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/workspace/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/workspace

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:wan2gp]
directory=/workspace/Wan2GP
command=/opt/wan2gp-venv/bin/python wgp.py --server-name 127.0.0.1 --server-port 7860 --save-masks
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/workspace/wan2gp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1",HF_HUB_ENABLE_HF_TRANSFER="0",HF_XET_HIGH_PERFORMANCE="1"
