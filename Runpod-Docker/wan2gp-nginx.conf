map $http_x_forwarded_host $wan2gp_public_host {
    "" $host;
    default $http_x_forwarded_host;
}

map $http_x_forwarded_proto $wan2gp_public_scheme {
    "" $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $wan2gp_connection_upgrade {
    "" close;
    default upgrade;
}

server {
    listen 7862;
    client_max_body_size 1024M;

    location / {
        auth_basic "Wan2GP Access Required";
        auth_basic_user_file /etc/nginx/.wan2gp-htpasswd;

        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        # RunPod terminates TLS before this nginx instance. Preserve the public
        # origin so Wan2GP's POST/WebSocket same-origin checks see what the
        # browser sees instead of the internal HTTP hop.
        proxy_set_header Host $wan2gp_public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $wan2gp_public_host;
        proxy_set_header X-Forwarded-Proto $wan2gp_public_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wan2gp_connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
